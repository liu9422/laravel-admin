$:
  tag_push:
    - docker:
        image: docker.cnb.cool/examples/language/php-8.4
        stages:
          - name: setup netrc
            script: printf "machine composer.cnb.cool\nlogin cnb\npassword %s\n" "${CNB_TOKEN}" > ~/.netrc
          - name: archive
            script: composer archive -f zip --file package
          - name: upload
            script: curl --netrc -T package.zip "https://composer.cnb.cool/vosbyte.com/lcj/common.service/laravel-admin-frankenphp/-/packages/upload/liu9422/laravel-admin/${CNB_BRANCH}"
